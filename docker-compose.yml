# DOOH POI Planner — local, single-user, no-auth stack (SPEC §12).
# Ports bind to 127.0.0.1 only: there is no auth, do not expose publicly.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dooh
      POSTGRES_USER: dooh
      POSTGRES_PASSWORD: dooh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dooh"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://dooh:dooh@db:5432/dooh
      AUTO_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data            # drop .osm.pbf extracts here for the etl

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

  # One-shot ETL importer (SPEC §6). Run on demand:
  #   docker compose run --rm etl --pbf /data/germany-latest.osm.pbf --country de
  etl:
    build: ./api
    profiles: ["etl"]
    environment:
      DATABASE_URL: postgresql://dooh:dooh@db:5432/dooh
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
    entrypoint: ["python", "-m", "etl.import_osm"]

volumes:
  pgdata:
