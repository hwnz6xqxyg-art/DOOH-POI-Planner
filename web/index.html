<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOOH POI Planner</title>
  </head>
  <body>
    <header id="topbar">
      <div class="brand">DOOH&nbsp;POI&nbsp;Planner</div>
      <div class="radius-ctl">
        <label>Radius <b id="radiusVal">500</b> m</label>
        <input id="globalRadius" type="range" min="50" max="5000" step="50" value="500" />
      </div>
      <div id="freshness" class="freshness"></div>
    </header>

    <div id="layout">
      <!-- LEFT: POI discovery -->
      <aside id="left" class="panel">
        <h2>POIs entdecken</h2>

        <section class="block">
          <label class="lbl">Marke suchen</label>
          <input id="brandInput" type="text" placeholder="z. B. Rossmann, Edeka …" autocomplete="off" />
          <div id="brandSuggest" class="suggest"></div>
          <div id="brandChips" class="chips"></div>
        </section>

        <section class="block">
          <label class="lbl">Kategorien</label>
          <div id="catTree" class="cat-tree"></div>
        </section>

        <section class="block">
          <label class="lbl">Gebiet</label>
          <div class="row">
            <button id="areaView" class="btn sm">Kartenausschnitt</button>
            <button id="areaDraw" class="btn sm">Polygon zeichnen</button>
            <button id="areaClear" class="btn sm ghost">Zurücksetzen</button>
          </div>
          <div id="areaInfo" class="hint"></div>
        </section>

        <section class="block">
          <label class="lbl">Attribut-Filter</label>
          <div id="tagFilters"></div>
          <button id="addTagFilter" class="btn sm ghost">+ Filter</button>
        </section>

        <button id="searchPois" class="btn primary full">POIs suchen</button>
        <div id="poiResult" class="result"></div>
        <div class="row">
          <button id="selectAllPois" class="btn sm" disabled>Alle als Anker</button>
          <button id="clearAnchors" class="btn sm ghost" disabled>Anker leeren</button>
        </div>
      </aside>

      <!-- MAP -->
      <main id="map"></main>

      <!-- RIGHT: inventory -->
      <aside id="right" class="panel">
        <h2>DOOH-Inventar</h2>
        <section class="block">
          <button id="uploadScreens" class="btn full">Inventar hochladen (.xlsx/.csv)</button>
          <div id="invTotal" class="hint"></div>
          <div id="partnerList" class="partners"></div>
          <div id="invEmpty" class="hint">Noch kein Inventar geladen.</div>
        </section>
        <section class="block">
          <button id="uploadPois" class="btn full ghost">Eigene POI-Liste hochladen</button>
          <div class="hint">Optional: eigene Koordinaten als Anker (Hybrid).</div>
        </section>
      </aside>
    </div>

    <!-- floating plan card -->
    <div id="planCard" class="plan-card">
      <div class="pc-row"><span>Anker</span><b id="pcAnchors">0</b></div>
      <div class="pc-row"><span>Screens im Radius</span><b id="pcScreens">0</b></div>
      <div class="pc-row"><span>Abdeckung</span><b id="pcCoverage">–</b></div>
      <div class="pc-actions">
        <button id="exportCsv" class="btn sm primary" disabled>Export CSV</button>
        <button id="exportRound" class="btn sm" disabled>Export je Partner</button>
      </div>
    </div>

    <!-- column mapping modal -->
    <div id="mapModal" class="modal hidden">
      <div class="modal-box">
        <h3 id="mapTitle">Spalten zuordnen</h3>
        <div id="mapSub" class="hint"></div>
        <div id="mapPartnerRow" class="maprow">
          <div class="mlabel">Partner <span class="req">*</span></div>
          <input id="mapPartner" type="text" />
        </div>
        <div id="mapFields"></div>
        <div id="mapSummary" class="map-summary"></div>
        <div class="modal-actions">
          <button id="mapCancel" class="btn ghost">Abbrechen</button>
          <button id="mapImport" class="btn primary">Importieren</button>
        </div>
      </div>
    </div>

    <input id="fileInput" type="file" accept=".xlsx,.csv,.txt" hidden />
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
