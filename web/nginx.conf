server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the FastAPI service (SPEC §12).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64m;   # large inventory uploads
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
